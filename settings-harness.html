<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings &amp; Workout Harness</title>
    <style>
      /* Stand-in for the game behind the screens, so the scrim has something to sit on. */
      body {
        background:
          radial-gradient(ellipse 80% 60% at 50% 0%, #ffc58a, transparent 70%),
          linear-gradient(180deg, #ff9a5a 0%, #ffe2b8 42%, #9c8f7e 42%, #6d6152 100%);
      }
      .harness-nav {
        position: fixed;
        left: 50%;
        bottom: 4px;
        transform: translateX(-50%);
        z-index: 50;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        font: 12px system-ui, sans-serif;
        opacity: 0.25;
      }
      .harness-nav:hover {
        opacity: 1;
      }
      .harness-nav a {
        color: #fff;
        background: #000a;
        padding: 2px 6px;
        border-radius: 4px;
        text-decoration: none;
      }
      body.shot .harness-nav {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="settings"></div>
    <div id="workout"></div>
    <nav class="harness-nav" id="nav"></nav>
    <script type="module" src="/src/ui/settings.harness.ts"></script>
  </body>
</html>
