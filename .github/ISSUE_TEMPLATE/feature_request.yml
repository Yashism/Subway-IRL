name: Feature request
description: Suggest an idea for the game
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it make the game better?
  - type: checkboxes
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - label: I would like to work on this myself
