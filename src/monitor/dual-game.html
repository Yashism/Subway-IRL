<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Monitor + game (dev only)</title>
    <!--
      Dev-only check of the live monitor against the real game page, in one tab:
      /src/monitor/dual-game.html            (game drives itself from the synth-full pose replay)
      /src/monitor/dual-game.html?game=<query string for the game, URL-encoded>
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      body { display: grid; grid-template-columns: 1.35fr 1fr; gap: 4px; }
      iframe { border: 0; width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <iframe id="mon" src="/monitor.html" title="monitor"></iframe>
    <iframe id="game" title="game"></iframe>
    <script>
      const q = new URLSearchParams(location.search).get('game') ?? 'posereplay=synth-full&god&seed=7';
      document.getElementById('game').src = `/index.html?${q}`;
    </script>
  </body>
</html>
